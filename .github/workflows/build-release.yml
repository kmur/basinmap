name: Build data release

# Runs the whole GBIF -> PMTiles release build in the cloud and publishes it to R2.
# Start it from the Actions tab: "Build data release" -> "Run workflow".
#
# Required repository secrets:
#   GBIF_USER, GBIF_PWD                       GBIF account that requests the download (gets the DOI)
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  (already used by deploy.yml)
#
# Releases are immutable: re-running with a version that already exists in the bucket fails
# unless "replace" is ticked. Production is only written when target=production.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.3.0)"
        required: true
        default: "v0.3.0"
      query:
        description: "Query file in data-pipeline/queries/"
        required: true
        default: "cyprinodontiformes_global.json"
      taxon_key:
        description: "GBIF Backbone key for the species index (547 = Cyprinodontiformes; blank = none)"
        default: "547"
      hydrobasins_level:
        description: "HydroBASINS level"
        default: "6"
      hydrobasins_region:
        description: "HydroBASINS region (na, sa, af, ... or all)"
        default: "all"
      basin_max_zoom:
        description: "Basin tiles max zoom (lower for global builds; MapLibre overzooms)"
        default: "7"
      download_key:
        description: "Reuse an existing GBIF download key instead of requesting a new one (optional)"
        default: ""
      target:
        description: "Bucket to publish to"
        type: choice
        options: [staging, production]
        default: staging
      publish:
        description: "Publish to R2 (untick to build and inspect the artifact only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-release-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GBIF_USER: ${{ secrets.GBIF_USER }}
      GBIF_PWD: ${{ secrets.GBIF_PWD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERSION: ${{ inputs.version }}
      WORK: data-pipeline/work
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies (wrangler)
        run: npm install

      - name: Check inputs and secrets
        run: |
          [[ "$VERSION" =~ ^v[0-9A-Za-z.-]+$ ]] || { echo "::error::Bad version '$VERSION'"; exit 1; }
          [ -f "data-pipeline/queries/${{ inputs.query }}" ] || { echo "::error::No such query file"; exit 1; }
          if [ -z "$GBIF_USER" ] || [ -z "$GBIF_PWD" ]; then
            echo "::error::Add the GBIF_USER and GBIF_PWD repository secrets first"; exit 1
          fi
          if [ "${{ inputs.target }}" = "production" ]; then
            echo "BUCKET=basinmap-public-data" >> "$GITHUB_ENV"
            echo "VERIFY_URL=https://data.basinmap.org" >> "$GITHUB_ENV"
          else
            echo "BUCKET=basinmap-public-data-staging" >> "$GITHUB_ENV"
            echo "VERIFY_URL=https://staging.basinmap.org/api/r2" >> "$GITHUB_ENV"
          fi

      - name: Pipeline unit tests
        run: python3 -m unittest discover -s data-pipeline/tests

      - name: Refuse to overwrite an existing release
        run: |
          if npx wrangler r2 object get "${BUCKET}/releases/${VERSION}/release_manifest.json" --remote --file /tmp/existing.json >/dev/null 2>&1; then
            echo "::error::${VERSION} already exists in ${BUCKET}. Releases are immutable; choose a new version."
            exit 1
          fi
          # The builder records the live release as previous_version.
          mkdir -p build-r2/releases
          npx wrangler r2 object get "${BUCKET}/releases/manifest.json" --remote --file build-r2/releases/manifest.json >/dev/null 2>&1 \
            && python3 -c 'import json;print("live release:", json.load(open("build-r2/releases/manifest.json"))["current_version"])' \
            || rm -f build-r2/releases/manifest.json

      - name: Pre-flight record count
        run: python3 data-pipeline/ingest_gbif_download.py count --query "data-pipeline/queries/${{ inputs.query }}"

      - name: Request GBIF download (DOI)
        id: request
        run: |
          if [ -n "${{ inputs.download_key }}" ]; then
            echo "key=${{ inputs.download_key }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 data-pipeline/ingest_gbif_download.py request --query "data-pipeline/queries/${{ inputs.query }}" | tee /tmp/request.json
          echo "key=$(python3 -c 'import json;print(json.load(open("/tmp/request.json"))["key"])')" >> "$GITHUB_OUTPUT"

      - name: Wait for GBIF and fetch the download
        run: |
          echo "GBIF download ${{ steps.request.outputs.key }}: https://www.gbif.org/occurrence/download/${{ steps.request.outputs.key }}"
          python3 data-pipeline/ingest_gbif_download.py --workdir "$WORK" fetch --key "${{ steps.request.outputs.key }}" --poll-seconds 60

      - name: Fetch HydroBASINS
        run: |
          python3 data-pipeline/ingest_gbif_download.py --workdir "$WORK" fetch-hydrobasins --region "${{ inputs.hydrobasins_region }}" \
            --level "${{ inputs.hydrobasins_level }}"
          ls -l "$WORK/hydrobasins"

      - name: Fetch GBIF Backbone checklist
        if: inputs.taxon_key != ''
        run: python3 data-pipeline/taxonomy.py fetch --taxon-key "${{ inputs.taxon_key }}" --workdir "$WORK/taxonomy"

      - name: Build release
        run: |
          LEVEL=$(printf '%02d' "${{ inputs.hydrobasins_level }}")
          CHECKLIST=()
          [ -n "${{ inputs.taxon_key }}" ] && CHECKLIST=(--checklist "$WORK/taxonomy/checklist.json")
          python3 data-pipeline/ingest_gbif_download.py build \
            --gbif-dir "$WORK/gbif-${{ steps.request.outputs.key }}" \
            --hydrobasins "$WORK"/hydrobasins/hybas_*_lev${LEVEL}_v1c.zip \
            --keep-unassigned "${CHECKLIST[@]}" \
            --version "$VERSION" --output-root build-r2 \
            --basin-zooms 0 "${{ inputs.basin_max_zoom }}" \
            --max-archive-mb 290 | tee /tmp/summary.json
          du -sh "build-r2/releases/$VERSION"
          ls -l "build-r2/releases/$VERSION"

      - name: Upload release as a workflow artifact (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.version }}
          path: build-r2/releases/
          retention-days: 7

      - name: Publish to R2 (${{ inputs.target }})
        if: inputs.publish
        run: python3 data-pipeline/publish_release.py publish --root build-r2 --version "$VERSION" --mode wrangler --bucket "$BUCKET" --jobs 12 --retries 5

      - name: Verify HTTP 206 range delivery
        if: inputs.publish
        run: |
          sleep 20
          python3 data-pipeline/publish_release.py verify-http --root build-r2 --base-url "$VERIFY_URL"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Data release ${VERSION} (${{ inputs.target }})"
            echo
            echo "- GBIF download: https://www.gbif.org/occurrence/download/${{ steps.request.outputs.key }}"
            [ -f /tmp/summary.json ] && { echo; echo '```json'; cat /tmp/summary.json; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
