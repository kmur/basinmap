name: Switch live release

# Point the live site at a release that is already in the bucket (no rebuild). Takes effect for
# visitors within about a minute (manifest.json is cached for 60 s). Undo by running it again with
# the previous version; the new manifest records what was live as previous_version.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which site"
        type: choice
        options: [staging, production]
        default: staging
      version:
        description: "Release to make live (e.g. v0.2.0 or v0.3.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: build-release-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies (wrangler)
        run: npm install

      - name: Choose bucket
        run: |
          [[ "$VERSION" =~ ^v[0-9A-Za-z.-]+$ ]] || { echo "::error::Bad version '$VERSION'"; exit 1; }
          if [ "${{ inputs.target }}" = "production" ]; then
            echo "BUCKET=basinmap-public-data" >> "$GITHUB_ENV"
            echo "SITE=https://basinmap.org" >> "$GITHUB_ENV"
          else
            echo "BUCKET=basinmap-public-data-staging" >> "$GITHUB_ENV"
            echo "SITE=https://staging.basinmap.org" >> "$GITHUB_ENV"
          fi

      - name: Fetch the release and the live manifest
        run: |
          mkdir -p /tmp/switch
          if ! npx wrangler r2 object get "${BUCKET}/releases/${VERSION}/release_manifest.json" --remote --file /tmp/switch/release.json >/dev/null 2>&1; then
            echo "::error::${VERSION} is not published in ${BUCKET}. Build it with 'Build data release' first."
            exit 1
          fi
          npx wrangler r2 object get "${BUCKET}/releases/manifest.json" --remote --file /tmp/switch/live.json >/dev/null 2>&1 || true
          [ -f /tmp/switch/live.json ] && python3 -c 'import json;print("live now:", json.load(open("/tmp/switch/live.json"))["current_version"])'

      - name: Write and upload the new root manifest
        run: |
          python3 data-pipeline/publish_release.py make-root --release-manifest /tmp/switch/release.json \
            --live-manifest /tmp/switch/live.json --version "$VERSION" --out /tmp/switch/manifest.json
          npx wrangler r2 object put "${BUCKET}/releases/manifest.json" --remote --file /tmp/switch/manifest.json \
            --cache-control "public, max-age=60, must-revalidate" --content-type application/json
          {
            echo "### ${SITE} now serves ${VERSION}"
            echo
            echo "Visitors see it within about a minute. To undo, run this workflow again with the previous version."
          } >> "$GITHUB_STEP_SUMMARY"
