name: Deploy basinmap.org

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm install

      - name: Run automated tests
        run: |
          python3 -m unittest discover -s data-pipeline/tests -v
          python3 -m unittest discover -s tests -v

      - name: Typecheck Worker and frontend TypeScript
        run: npx tsc --noEmit

      - name: Build static frontend bundle
        run: python3 scripts/build_dist.py

      - name: Provision R2 buckets and CORS policy
        run: |
          npx wrangler r2 bucket create basinmap-public-data || true
          npx wrangler r2 bucket create basinmap-intake-media || true
          npx wrangler r2 bucket cors set basinmap-public-data --file r2-cors.json --force

      - name: Provision D1 database and resolve UUID
        run: |
          npx wrangler d1 create basinmap-db || true
          python3 -c '
          import json, pathlib, subprocess
          raw = subprocess.check_output(["npx", "wrangler", "d1", "list", "--json"], text=True)
          dbs = json.loads(raw)
          match = next((d for d in dbs if d.get("name") == "basinmap-db"), None)
          if not match:
              raise SystemExit("basinmap-db not found in wrangler d1 list --json")
          db_id = match["uuid"]
          cfg_path = pathlib.Path("wrangler.jsonc")
          cfg_path.write_text(
              cfg_path.read_text(encoding="utf-8").replace("00000000-0000-0000-0000-000000000000", db_id),
              encoding="utf-8",
          )
          print(f"Configured D1 database_id={db_id}")
          '

      - name: Apply D1 schema migrations
        run: npx wrangler d1 migrations apply basinmap-db --remote

      - name: Publish demo spatial release and initialize approved overlay on R2
        run: |
          python3 data-pipeline/publish_release.py publish --root public-r2 --version v0.1.0-demo --mode wrangler
          if ! npx wrangler r2 object get basinmap-public-data/overlays/approved.geojson --remote --file /tmp/existing-approved.geojson >/dev/null 2>&1; then
            npx wrangler r2 object put basinmap-public-data/overlays/approved.geojson --remote --file public-r2/overlays/approved.geojson --cache-control "public, max-age=60, must-revalidate" --content-type "application/json"
          else
            echo "Preserving existing live overlays/approved.geojson"
          fi

      - name: Deploy Worker API and Static Assets to basinmap.org
        run: npx wrangler deploy
