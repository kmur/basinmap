name: Deploy basinmap.org

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select target Cloudflare environment
        run: |
          if [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "CF_ENV=staging" >> "$GITHUB_ENV"
            echo "PUBLIC_BUCKET=basinmap-public-data-staging" >> "$GITHUB_ENV"
            echo "INTAKE_BUCKET=basinmap-intake-media-staging" >> "$GITHUB_ENV"
            echo "D1_NAME=basinmap-db-staging" >> "$GITHUB_ENV"
            echo "D1_PLACEHOLDER=11111111-1111-1111-1111-111111111111" >> "$GITHUB_ENV"
            echo "WRANGLER_ENV_FLAG=--env staging" >> "$GITHUB_ENV"
          else
            echo "CF_ENV=production" >> "$GITHUB_ENV"
            echo "PUBLIC_BUCKET=basinmap-public-data" >> "$GITHUB_ENV"
            echo "INTAKE_BUCKET=basinmap-intake-media" >> "$GITHUB_ENV"
            echo "D1_NAME=basinmap-db" >> "$GITHUB_ENV"
            echo "D1_PLACEHOLDER=00000000-0000-0000-0000-000000000000" >> "$GITHUB_ENV"
            echo "WRANGLER_ENV_FLAG=" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm install

      - name: Run automated tests
        run: |
          python3 -m unittest discover -s data-pipeline/tests -v
          python3 -m unittest discover -s tests -v

      - name: Typecheck Worker and frontend TypeScript
        run: npx tsc --noEmit

      - name: Build static frontend bundle
        run: python3 scripts/build_dist.py

      - name: Provision R2 buckets and CORS policy (${{ env.CF_ENV }})
        run: |
          npx wrangler r2 bucket create "${PUBLIC_BUCKET}" || true
          npx wrangler r2 bucket create "${INTAKE_BUCKET}" || true
          npx wrangler r2 bucket cors set "${PUBLIC_BUCKET}" --file r2-cors.json --force

      - name: Provision D1 database and resolve UUID (${{ env.CF_ENV }})
        run: |
          npx wrangler d1 create "${D1_NAME}" || true
          python3 -c '
          import json, os, pathlib, subprocess
          d1_name = os.environ["D1_NAME"]
          placeholder = os.environ["D1_PLACEHOLDER"]
          raw = subprocess.check_output(["npx", "wrangler", "d1", "list", "--json"], text=True)
          dbs = json.loads(raw)
          match = next((d for d in dbs if d.get("name") == d1_name), None)
          if not match:
              raise SystemExit(f"{d1_name} not found in wrangler d1 list --json")
          db_id = match["uuid"]
          cfg_path = pathlib.Path("wrangler.jsonc")
          cfg_path.write_text(
              cfg_path.read_text(encoding="utf-8").replace(placeholder, db_id),
              encoding="utf-8",
          )
          print(f"Configured {d1_name} database_id={db_id}")
          '

      - name: Apply D1 schema migrations (${{ env.CF_ENV }})
        run: npx wrangler d1 migrations apply "${D1_NAME}" ${WRANGLER_ENV_FLAG} --remote

      - name: Publish demo spatial release and initialize approved overlay (${{ env.CF_ENV }})
        run: |
          python3 data-pipeline/publish_release.py publish --root public-r2 --version v0.1.0-demo --mode wrangler --bucket "${PUBLIC_BUCKET}"
          if ! npx wrangler r2 object get "${PUBLIC_BUCKET}/overlays/approved.geojson" --remote --file /tmp/existing-approved.geojson >/dev/null 2>&1; then
            npx wrangler r2 object put "${PUBLIC_BUCKET}/overlays/approved.geojson" --remote --file public-r2/overlays/approved.geojson --cache-control "public, max-age=60, must-revalidate" --content-type "application/json"
          else
            echo "Preserving existing ${PUBLIC_BUCKET}/overlays/approved.geojson"
          fi

      - name: Deploy Worker API and Static Assets (${{ env.CF_ENV }})
        run: npx wrangler deploy ${WRANGLER_ENV_FLAG}
